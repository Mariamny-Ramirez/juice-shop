name: Deploy to EC2

on:
  push:
    branches: [ master, main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mariamny-ramirez/juice-shop:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/mariamny-ramirez/juice-shop:latest
            sudo docker pull $IMAGE
            sudo docker rm -f juice-shop || true
            sudo docker run -d --restart always -p 3000:3000 --name juice-shop $IMAGE
